# Clefira QA Orchestrator — test fixtures
# ==========================================
#
# Each entry under `cases:` is a self-contained test scenario. Steps run
# top-to-bottom; the case fails on the first failing step unless
# `stop_on_failure: false`. Tags filter runs via --tag.
#
# Available step actions (see qa_orchestrator.py:run_step):
#   switch_mode        { mode }
#   drill_start        { type, key, level, octaves, hand, tempo, seed? }
#   drill_play         {}
#   drill_stop         {}
#   wait_ms            { ms }
#   midi_inject        { pitch, velocity?, hold_ms? }
#   assert             { member, op, value }   # op: eq/ne/gt/gte/lt/lte/in
#   assert_audio       { pitch }               # drains probe + checks pitch class
#   screenshot         { tag }
#
# Customization points are marked with `# CUSTOMIZE:` so app-specific tweaks
# are easy to spot.

cases:
  # ---------------------------------------------------------------------
  # SMOKE — every CI run hits these. Fast, broad coverage.
  # ---------------------------------------------------------------------
  - name: "Debug server health"
    tags: [smoke]
    steps:
      - name: "Service responds with build info"
        action: assert
        member: "_qa_enabled"
        op: in
        value: [true, false]

  - name: "Generate scale + play + audio fires"
    tags: [smoke, drills]
    steps:
      - name: "Generate C major scale at level 3"
        action: drill_start
        type: scale
        key_pc: 0
        key_is_minor: false
        level: 3
        octaves: 1
        hand: right
        seed: 12345
      - name: "Press Play"
        action: drill_play
      - name: "Wait for first note to fire"
        action: wait_ms
        ms: 400
      - name: "Audio probe contains middle-C"
        action: assert_audio
        pitch: 60  # C4
      - name: "Stop"
        action: drill_stop

  # ---------------------------------------------------------------------
  # MODE TRANSITIONS — make sure the app's top-level state machine is sane.
  # ---------------------------------------------------------------------
  - name: "Mode transition matrix"
    tags: [smoke, modes]
    steps:
      - name: "Switch to Interval"
        action: switch_mode
        mode: Interval
      - name: "Wait for refresh"
        action: wait_ms
        ms: 200
      - name: "Switch to Chord"
        action: switch_mode
        mode: Chord
      - name: "Switch to Note Chase"
        action: switch_mode
        mode: "Note Chase"
      # CUSTOMIZE: add more modes here as the app grows.

  # ---------------------------------------------------------------------
  # MIDI ROUNDTRIP — synthetic note-on flows through Input.parse_input_event,
  # debug_server captures it, and the grading pipeline sees it as a hit.
  # ---------------------------------------------------------------------
  - name: "MIDI roundtrip — perfect-play accuracy"
    tags: [midi]
    steps:
      - name: "Open scale exercise"
        action: drill_start
        type: scale
        key_pc: 0
        key_is_minor: false
        level: 2
        octaves: 1
        hand: right
        seed: 4242
      - name: "Start playback"
        action: drill_play
      - name: "Let play loop settle (a few frames)"
        action: wait_ms
        ms: 100
      - name: "Verify grading became active"
        action: assert
        member: "_practice_drills_panel._midi_grading_active"
        op: eq
        value: true
      # Inject the C major scale notes so the grading pipeline scores 100%.
      # Each tap matches an expected event within the timing window.
      - name: "Tap C4"
        action: midi_inject
        pitch: 60
        hold_ms: 80
      - name: "Tap D4"
        action: midi_inject
        pitch: 62
        hold_ms: 80
      - name: "Tap E4"
        action: midi_inject
        pitch: 64
        hold_ms: 80
      - name: "Tap F4"
        action: midi_inject
        pitch: 65
        hold_ms: 80
      - name: "Tap G4"
        action: midi_inject
        pitch: 67
        hold_ms: 80
      - name: "Tap A4"
        action: midi_inject
        pitch: 69
        hold_ms: 80
      - name: "Tap B4"
        action: midi_inject
        pitch: 71
        hold_ms: 80
      - name: "Tap C5"
        action: midi_inject
        pitch: 72
        hold_ms: 80
      - name: "Let playback finish + scoring"
        # Scale exercise at this tempo runs ~6.5 s plus ~200 ms tail
        # before the "finish" event fires + _last_accuracy gets set.
        action: wait_ms
        ms: 8000
      - name: "Grading ran (accuracy >= 0)"
        action: assert
        member: "_practice_drills_panel._last_accuracy"
        op: gte
        value: 0.0
        # The burst-injection above doesn't match the playback tempo
        # (all 8 taps in ~30 ms, playback fires notes ~400 ms apart),
        # so we only verify the grading PIPELINE executed (accuracy is
        # non-negative = grading happened, not -1.0 sentinel for "no
        # MIDI ever arrived"). To assert real accuracy, the test would
        # need to interleave wait_ms steps between taps matched to the
        # exercise tempo. Left for a follow-up — current bot wiring
        # doesn't have a "wait until next expected beat" primitive.

  # ---------------------------------------------------------------------
  # DRILL EDGE CASES — generators that take less travelled code paths.
  # ---------------------------------------------------------------------
  - name: "Smart Drill Library — 16th-note scale"
    tags: [drills, library]
    steps:
      - name: "Generate scale_16ths at level 6"
        action: drill_start
        type: scale_16ths
        key_pc: 7  # G major
        key_is_minor: false
        level: 6
        octaves: 2
        hand: right
        seed: 9001
      - name: "Screenshot — 16ths render"
        action: screenshot
        tag: "scale_16ths_G_major"

  - name: "Smart Drill Library — Jazz ii-V-I"
    tags: [drills, library, jazz]
    steps:
      - name: "Generate jazz_ii_v_i_major in C"
        action: drill_start
        type: jazz_ii_v_i_major
        key_pc: 0
        level: 5
        octaves: 1
        hand: right
      - name: "Screenshot — ii-V-I render"
        action: screenshot
        tag: "jazz_ii_v_i_C_major"
      - name: "Play it to verify chord-block audio fires"
        action: drill_play
      - name: "Wait for first chord"
        action: wait_ms
        ms: 600
      - name: "Audio probe contains C (root of resolution)"
        action: assert_audio
        pitch: 60
      - name: "Stop"
        action: drill_stop

  - name: "Smart Drill Library — Stride bass (left hand)"
    tags: [drills, library, jazz]
    steps:
      - name: "Generate stride bass in F"
        action: drill_start
        type: jazz_stride_bass
        key_pc: 5
        key_is_minor: false
        level: 5
        octaves: 1
        hand: left
      - name: "Screenshot — stride render"
        action: screenshot
        tag: "stride_bass_F_major"
      # CUSTOMIZE: when fingering audit lands in CI, add an assert that
      # the lowest LH note is fingered 5 not 1.

  # ---------------------------------------------------------------------
  # OTTAVA / 8VB — exercises the bass-clef low-pitch render path.
  # ---------------------------------------------------------------------
  - name: "Bass 8vb — Hanon in low octave"
    tags: [drills, ottava]
    steps:
      - name: "Generate Hanon No. 1 for left hand, dropped octave"
        action: drill_start
        type: hanon_1
        key_pc: 0
        key_is_minor: false
        level: 4
        hand: left
      - name: "Screenshot — should render with 8vb bracket when notes go below C2"
        action: screenshot
        tag: "hanon_lh_8vb_check"

  # ---------------------------------------------------------------------
  # SETTINGS — sanity check via the assert endpoint.
  # ---------------------------------------------------------------------
  - name: "Settings: choice count defaults sane"
    tags: [settings]
    steps:
      - name: "Choice count between 2 and 6"
        action: assert
        member: "_ear_choice_count"
        op: gte
        value: 2
      - name: "Choice count at most 6"
        action: assert
        member: "_ear_choice_count"
        op: lte
        value: 6
